{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 400px;">
    <h2 class="mb-4 text-center">Регистрация</h2>

    <form method="post">
        {% csrf_token %}

        {% for field in form %}
            <div class="mb-3">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <button class="btn btn-success w-100">
            Зарегистрироваться
        </button>
    </form>
</div>
{% endblock %}
